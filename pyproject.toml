[tool.hatch.metadata]
# `pace-scene-skills` is pinned to a git revision, the same way this package's own
# consumers pin it. Hatch refuses a direct reference unless told.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pace-core"
version = "0.10.0"
description = "PACE: typed storyboard specification, script breakdown, solved camera geometry and self-auditing checks."
readme = "README.md"
# The Blender kernels run in Blender 4.2's bundled Python 3.11.
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Studio Π"}]
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    # Every LLM call (llm_client): one interface over Anthropic, OpenAI-compatible
    # gateways, local servers and the providers LiteLLM adds.
    "litellm>=1.103.1,<2",
    # The breakdown's decomposition criteria. They are skills, not constants:
    # the same SKILL.md an agent follows is the prompt these modules send, so
    # a criterion cannot be changed in one place and stay put in the other.
    # A git direct reference: this package cannot be published to PyPI until
    # pace-scene-skills is, and consumers must allow direct references too.
    "pace-scene-skills @ git+https://github.com/StudioPiLabs/pace-scene-skills@fa3fbdc21aa3c9d397729ce3d5bc1b33f27ccd5a",
]

[project.optional-dependencies]
usd = ["usd-core>=24.0"]
# PDF screenplays in breakdown.split_script.
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/StudioPiLabs/pace-core"

[tool.hatch.build.targets.wheel]
packages = ["src/pace_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
